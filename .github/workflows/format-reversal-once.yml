name: Format BRTI feature once

on:
  push:
    branches:
      - feature/brti-reversal-alerts-20261025
    paths:
      - .github/workflows/format-reversal-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brti-reversal-alerts-20261025
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format only the BRTI reversal files
        run: |
          npx prettier --write \
            projects/kalshi-brti-monitor/src/main/java/com/ronrob/brti/feed/BrtiReversalMath.java \
            projects/kalshi-brti-monitor/src/main/java/com/ronrob/brti/feed/BrtiTracker.java \
            projects/kalshi-brti-monitor/src/main/resources/static/intelligence.html \
            projects/kalshi-brti-monitor/src/test/java/com/ronrob/brti/feed/BrtiReversalMathTest.java \
            projects/kalshi-brti-monitor/src/test/java/com/ronrob/brti/feed/BrtiTrackerTest.java
          git diff --check
      - name: Commit formatting changes to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/kalshi-brti-monitor
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format BRTI reversal implementation"
          git push origin HEAD:refs/heads/feature/brti-reversal-alerts-20261025
