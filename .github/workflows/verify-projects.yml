name: Verify portfolio projects
on: [push, pull_request]
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [kalshi-brti-monitor, family-reading-tracker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh ./mvnw -B test
        working-directory: projects/${{ matrix.project }}
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [website, projects/family-reading-tracker/frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: npm run lint
        working-directory: ${{ matrix.directory }}
      - run: npm run build
        working-directory: ${{ matrix.directory }}
      - run: npm run build:demo
        if: matrix.directory == 'projects/family-reading-tracker/frontend'
        working-directory: projects/family-reading-tracker/frontend
      - run: node --test projects/kalshi-brti-monitor/demo/quality.test.mjs
        if: matrix.directory == 'website'
